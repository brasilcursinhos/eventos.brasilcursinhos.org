{% extends "restricted/admin/base.html" %}

{% block main2 %}
    <h2 class="mt-3 mb-4 fw-bold">Lista de transaçoes</h2>
    <p><a href="/administrador/conciliar-transacoes">Conciliar Transacoes</a></p>
    {% for transaction in transactions %}
    <form action="/administrador/transacoes" method="post">
      {{ csrf_field() }}
      <input type="hidden" name="user-id" value="{{transaction.userId}}">
      <input type="hidden" name="transaction-id" value="{{transaction.id}}">
      <div class="row mb-2">
        <div class="col-auto">
          {{'%03d'|format(transaction.id)}}
        </div>
        <div class="col-2">
          {{transaction.status.name}}
        </div>
        <div class="col-6">
          <input type="text" class="form-control" name="provider-id" value="{{transaction.providerTransactionId}}" required>
        </div>
        <div class="col-1">
          <button type="submit" class="btn btn-secondary-bc">SALVAR</button>
        </div>
      </div>
    </form>
    {% endfor %}
{% endblock main2 %}
