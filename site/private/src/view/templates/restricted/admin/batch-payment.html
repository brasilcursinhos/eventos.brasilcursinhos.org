{% extends "restricted/admin/base.html" %}

{% block main2 %}
    <h2 class="mt-3 mb-4 fw-bold">Registrar inscrição</h2>
    <form action="/administrador/pagamento-lote/{{amount}}" method="post" enctype="multipart/form-data">
      {{ csrf_field() }}
      <input type="hidden" name="proof-type" value="payment">
      <input type="hidden" name="MAX_FILE_SIZE" value="2097152">
      <input type="hidden" name="event-id" value="1">
      {{ csrf_field() }}
      <div class="row g-2 mb-3">
        <div class="col">
          <label for="payment-proof" class="form-label"><strong>Comprovante de pagamento:</strong></label>
          <input class="form-control" type="file" id="payment-proof" name="payment-proof" accept="application/pdf,image/*" required>
        </div>
        <small class="mt-2">É aceito arquivo de imagem ou PDF com até 2MB de tamanho.</small>
      </div>
      <div class="row mb-3">
        <div class="col-3">
          <input type="text" class="form-control" id="total-amount" name="total-amount" placeholder="Digite o valor total" required>
        </div>
      </div>
      {% for i in range(1, amount) %}
      <div class="row mb-3 me-3">
        <div class="col-3">
          <input type="text" class="form-control" id="cpf-{{i}}" name="cpf-{{i}}" placeholder="Digite o CPF" required>
        </div>
        <div class="col-3">
          <select name="ticket-id-{{i}}" id="ticket-id-{{i}}" class="form-select" required>
            <option value="">Selecione...</option>
            {% for ticket in tickets %}
              {% if ticket.type.name == 'AFFILIATED_CUP_MEMBER' or ticket.type.name == 'EXTERNAL_PARTICIPANT' %}
              <option value="{{ticket.id}}">{{ticket.name}} (R$ {{ticket.price}})</option>
              {% endif %}
            {% endfor %}
          </select>
        </div>
      </div>
      {% endfor %}
      <div class="row">
        <div class="col-1">
          <button type="submit" class="btn btn-secondary-bc"><strong>INSCRIÇÃO</strong></button>
        </div>
      </div>
    </form>
{% endblock main2 %}
