{% extends "restricted/admin/base.html" %}

{% block main2 %}
    <h2 class="mt-3 fw-bold">Inscrições ENCUP</h2>
    <hr class="border-4">
    <form action="/administrador/cadastro" method="post">
      {{ csrf_field() }}
      <div class="row g-3 mb-3">
        <div class="col-3">
          <input type="text" class="form-control" id="cpf-registration" name="cpf-registration" value="{{lastCpf}}" placeholder="Digite o CPF" required>
        </div>
        <div class="col">
          <input type="email" class="form-control" id="email" name="email" autocomplete="off" placeholder="Digite o e-mail" required>
        </div>
        <div class="col">
          <input type="email" class="form-control" id="email2" name="email2" autocomplete="off" placeholder="Confirme o e-mail" required>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-secondary-bc"><strong>CADASTRAR</strong></button>
        </div>
      </div>
    </form>
    <form action="/administrador/encup/inscricao" method="post">
      {{ csrf_field() }}
      <div class="row g-3 mb-3">
        <div class="col-3">
          <input type="text" class="form-control" id="cpf-registration" name="cpf" value="{{lastCpf}}" placeholder="Digite o CPF" required>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-secondary-bc"><strong>INSCRIÇÃO</strong></button>
        </div>
      </div>
    </form>
    <form action="/administrador/encup/pagamento" method="post">
      {{ csrf_field() }}
      <div class="row g-3 mb-3">
        <div class="col-3">
          <input type="text" class="form-control" id="cpf-payment" name="cpf" value="{{lastCpf}}" placeholder="Digite o CPF" required>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-secondary-bc"><strong>PAGAMENTO</strong></button>
        </div>
      </div>
    </form>
    <form action="/administrador/encup/lote-social" method="post">
      {{ csrf_field() }}
      <div class="row g-3 mb-3">
        <div class="col-3">
          <input type="text" class="form-control" id="cpf-social-request" name="cpf" value="{{lastCpf}}" placeholder="Digite o CPF" required>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-secondary-bc"><strong>LOTE SOCIAL</strong></button>
        </div>
      </div>
    </form>
    <form action="/administrador/encup/status" method="post">
      {{ csrf_field() }}
      <div class="row g-3 mb-3">
        <div class="col-3">
          <input type="text" class="form-control" id="cpf-status" name="cpf" value="{{lastCpf}}" placeholder="Digite o CPF" required>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-secondary-bc"><strong>STATUS</strong></button>
        </div>
      </div>
    </form>
{% endblock main2 %}
